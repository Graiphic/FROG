<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">FROG AI Generation Compatibility vs AI Inspectability Orville Chart</title>
  <desc id="desc">Positive-quadrant Orville chart positioning C, C++, Rust, Python, LabVIEW, and FROG according to AI generation compatibility and AI inspectability. FROG sits in the top-right AI-governable zone.</desc>
  <defs>
    <marker id="axisArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0b3972" />
    </marker>
    <marker id="goldArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 Z" fill="#d99a00" />
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b3972" flood-opacity="0.12" />
    </filter>
    <style><![CDATA[
      .navy { fill: #0b3972; }
      .navy-stroke { stroke: #0b3972; }
      .gold { fill: #d99a00; }
      .gold-stroke { stroke: #d99a00; }
      .red { fill: #991b1b; }
      .red-stroke { stroke: #dc2626; }
      .label { font-family: "Segoe UI", Arial, sans-serif; fill: #0b3972; font-size: 18px; font-weight: 700; }
      .small { font-family: "Segoe UI", Arial, sans-serif; fill: #0b3972; font-size: 14px; }
      .small-italic { font-family: "Segoe UI", Arial, sans-serif; fill: #0b3972; font-size: 14px; font-style: italic; }
      .callout-title { font-family: "Segoe UI", Arial, sans-serif; fill: #991b1b; font-size: 16px; font-weight: 700; }
      .callout-text { font-family: "Segoe UI", Arial, sans-serif; fill: #991b1b; font-size: 13px; font-style: italic; }
      .zone-title { font-family: "Segoe UI", Arial, sans-serif; fill: #991b1b; font-size: 27px; font-weight: 800; }
      .zone-text { font-family: "Segoe UI", Arial, sans-serif; fill: #991b1b; font-size: 16px; font-style: italic; }
      .gold-title { font-family: "Segoe UI", Arial, sans-serif; fill: #c17f00; font-size: 26px; font-weight: 800; }
      .gold-subtitle { font-family: "Segoe UI", Arial, sans-serif; fill: #c17f00; font-size: 16px; font-style: italic; }
      .bullet { font-family: "Segoe UI", Arial, sans-serif; fill: #0b3972; font-size: 15px; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff" />

  <text x="22" y="34" class="navy" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">AI Generation Compatibility</text>
  <text x="22" y="58" class="small-italic">(how naturally AI systems can generate useful software artifacts)</text>

  <g id="plot">
    <line x1="120" y1="640" x2="930" y2="640" stroke="#0b3972" stroke-width="4" marker-end="url(#axisArrow)" />
    <line x1="120" y1="640" x2="120" y2="95" stroke="#0b3972" stroke-width="4" marker-end="url(#axisArrow)" />

    <text x="68" y="623" class="label">Low</text>
    <text x="64" y="348" class="label">Medium</text>
    <text x="70" y="172" class="label">High</text>

    <text x="190" y="672" class="label">Low</text>
    <text x="465" y="672" class="label">Medium</text>
    <text x="720" y="672" class="label">High</text>

    <text transform="translate(55 475) rotate(-90)" class="navy" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">AI Generation Compatibility</text>
    <text x="812" y="685" class="navy" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">AI Inspectability</text>
    <text x="772" y="707" class="small-italic">(how well generated software can be reviewed, validated, and governed)</text>

    <line x1="120" y1="370" x2="930" y2="370" stroke="#9aa8b8" stroke-dasharray="5 5" stroke-width="1.2" opacity="0.45" />

    <rect x="125" y="190" width="340" height="450" rx="18" fill="#f8d7da" opacity="0.74" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 5" />
    <text x="160" y="430" class="zone-title">Syntax-First Zone</text>
    <text x="170" y="458" class="zone-text">Easy for AI to generate as text,</text>
    <text x="170" y="480" class="zone-text">but harder to inspect as systems</text>

    <rect x="180" y="115" width="250" height="86" rx="10" fill="#fff7f7" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="7 5" />
    <text x="200" y="145" class="callout-title">Syntax Bottleneck Zone</text>
    <text x="200" y="170" class="callout-text">Where implementation friction</text>
    <text x="200" y="190" class="callout-text">limits inspectability</text>
    <line x1="305" y1="201" x2="305" y2="232" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" />
    <circle cx="305" cy="232" r="5" fill="#be123c" />

    <rect x="600" y="45" width="320" height="158" rx="12" fill="#fff7df" stroke="#d99a00" stroke-width="1.4" filter="url(#softShadow)" />
    <text x="667" y="78" class="gold-title">AI-Governable Zone</text>
    <text x="646" y="105" class="gold-subtitle">Where generation meets inspectability</text>
    <text x="625" y="133" class="bullet">• Structured graphical logic</text>
    <text x="625" y="158" class="bullet">• Machine-friendly source representation</text>
    <text x="625" y="183" class="bullet">• Open execution-facing IR</text>
    <text x="625" y="208" class="bullet">• Reviewable, inspectable, auditable</text>

    <line x1="120" y1="122" x2="830" y2="122" stroke="#d99a00" stroke-width="2" stroke-dasharray="3 5" />
    <line x1="830" y1="122" x2="830" y2="640" stroke="#d99a00" stroke-width="2" stroke-dasharray="3 5" />
    <line x1="185" y1="640" x2="806" y2="142" stroke="#d99a00" stroke-width="6" marker-end="url(#goldArrow)" />

    <g id="points" font-family="Segoe UI, Arial, sans-serif">
      <circle cx="268" cy="208" r="7" fill="#0b3972" />
      <text x="258" y="238" class="label">C</text>

      <circle cx="290" cy="203" r="7" fill="#0b3972" />
      <text x="275" y="238" class="label">C++</text>

      <circle cx="335" cy="186" r="7" fill="#0b3972" />
      <text x="318" y="221" class="label">Rust</text>

      <circle cx="372" cy="149" r="7" fill="#0b3972" />
      <text x="390" y="157" class="label">Python</text>

      <circle cx="727" cy="564" r="7" fill="#0b3972" />
      <text x="743" y="572" class="label">LabVIEW</text>

      <rect x="665" y="592" width="205" height="54" rx="8" fill="#ffffff" stroke="#0b3972" stroke-width="1.4" stroke-dasharray="6 4" />
      <line x1="755" y1="592" x2="735" y2="572" stroke="#0b3972" stroke-width="1.4" stroke-dasharray="4 4" />
      <text x="688" y="612" class="small-italic" font-weight="700">Visual inspection strength</text>
      <text x="688" y="632" class="small-italic">Strong to inspect visually,</text>
      <text x="688" y="648" class="small-italic">weak for direct AI generation</text>
    </g>

    <g id="frog-marker">
      <polygon points="830,102 836,116 852,116 840,126 845,142 830,132 815,142 820,126 808,116 824,116" fill="#d99a00" />
      <text x="850" y="125" class="gold" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">FROG</text>
      <text x="850" y="150" class="gold" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">(.frog / JSON)</text>
    </g>
  </g>
</svg>
