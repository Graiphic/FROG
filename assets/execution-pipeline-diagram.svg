<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920" role="img" aria-labelledby="title desc">
  <title id="title">FROG end-to-end execution pipeline</title>
  <desc id="desc">Diagram showing canonical .frog source, validation, FIR, lowering and backend contract, widget realization, LLVM backend, UI host, and runtime orchestration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f4f3f" />
    </marker>
    <style>
      .box { fill: #f8fff9; stroke: #2f4f3f; stroke-width: 2; rx: 14; }
      .box-alt { fill: #eef8f0; stroke: #2f4f3f; stroke-width: 2; rx: 14; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #173323; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .sub { font-family: Arial, Helvetica, sans-serif; fill: #335c42; font-size: 15px; font-weight: 500; text-anchor: middle; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #335c42; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .line { stroke: #2f4f3f; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .join { stroke: #2f4f3f; stroke-width: 2.3; fill: none; }
    </style>
  </defs>

  <rect x="330" y="30" width="300" height="86" class="box" />
  <text x="480" y="68" class="text">.frog</text>
  <text x="480" y="94" class="sub">canonical source</text>

  <path d="M480 116 L480 155" class="line" />
  <rect x="300" y="155" width="360" height="74" class="box-alt" />
  <text x="480" y="199" class="text">structural validation</text>

  <path d="M480 229 L480 268" class="line" />
  <rect x="300" y="268" width="360" height="74" class="box-alt" />
  <text x="480" y="312" class="text">semantic validation</text>

  <path d="M480 342 L480 383" class="line" />
  <rect x="330" y="383" width="300" height="86" class="box" />
  <text x="480" y="421" class="text">FIR</text>
  <text x="480" y="447" class="sub">open Execution IR</text>

  <path d="M480 469 L480 500" class="join" />
  <path d="M480 500 L250 500 L250 545" class="line" />
  <path d="M480 500 L710 500 L710 545" class="line" />
  <text x="250" y="522" class="label">computation / dataflow</text>
  <text x="710" y="522" class="label">front panel / bindings</text>

  <rect x="95" y="545" width="310" height="86" class="box" />
  <text x="250" y="582" class="text">lowering</text>
  <text x="250" y="608" class="sub">backend contract</text>

  <rect x="555" y="545" width="310" height="86" class="box" />
  <text x="710" y="582" class="text">widget realization</text>
  <text x="710" y="608" class="sub">.wfrog + SVG</text>

  <path d="M250 631 L250 672" class="line" />
  <path d="M710 631 L710 672" class="line" />

  <rect x="95" y="672" width="310" height="86" class="box-alt" />
  <text x="250" y="709" class="text">LLVM backend</text>
  <text x="250" y="735" class="sub">native artifact</text>

  <rect x="555" y="672" width="310" height="86" class="box-alt" />
  <text x="710" y="709" class="text">UI host</text>
  <text x="710" y="735" class="sub">replaceable host</text>

  <path d="M250 758 L250 800 L480 800" class="join" />
  <path d="M710 758 L710 800 L480 800" class="join" />
  <path d="M480 800 L480 824" class="line" />

  <rect x="330" y="824" width="300" height="78" class="box" />
  <text x="480" y="853" class="text">runtime</text>
  <text x="480" y="877" class="sub">orchestration, bindings, scheduling, diagnostics</text>
</svg>
