<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 150"
     role="img"
     aria-label="FROG default enum rectangular ring realization template"
     data-frog-template="frog.realizations.default.enum.rectangular_ring"
     data-frog-target-classes="frog.widgets.enum_control frog.widgets.enum_indicator"
     data-frog-variant="rectangular_ring">
  <title>FROG Default Enum Rectangular Ring Realization Template</title>
  <desc>Semantic SVG template for the default enum ring-like realization.</desc>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="18"
          font-family="system-ui, Segoe UI, Arial, sans-serif"
          font-size="12"
          fill="#6b7280">enum_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          x="16"
          y="46"
          style="display: var(--frog-enum-caption-display, inline); fill: var(--frog-enum-caption-fill, #111827); font-family: var(--frog-enum-caption-font-family, system-ui, Segoe UI, Arial, sans-serif); font-size: var(--frog-enum-caption-font-size, 14px); font-weight: var(--frog-enum-caption-font-weight, 600);">Enum</text>

    <rect id="value_face"
          data-frog-part="value_face"
          x="22"
          y="82"
          width="208.154"
          height="28"
          style="fill: var(--frog-enum-value-face-fill, #ffffff); stroke: var(--frog-enum-value-face-stroke, #94a3b8); stroke-width: var(--frog-enum-value-face-stroke-width, 1px); vector-effect: non-scaling-stroke;"
          data-frog-bind="style.value_face.*" />

    <text id="value_display"
          data-frog-part="value_display"
          data-frog-member="value selected.text"
          data-frog-anchor="value_display.left_center"
          x="34"
          y="97"
          dominant-baseline="middle"
          font-family="system-ui, Segoe UI, Arial, sans-serif"
          font-size="16"
          fill="#111111"
          data-frog-bind="value items[] selected.* style.value_display.*">Item 0</text>

    <rect id="selector_face"
          data-frog-part="selector_face"
          data-frog-layout-anchor-part="value_face"
          data-frog-layout-anchor-edge="right"
          data-frog-layout-gap-units="3.959"
          x="234.113"
          y="82"
          width="24"
          height="25.077"
          rx="1"
          style="display: var(--frog-enum-selector-display, inline); fill: var(--frog-enum-selector-fill, #e5e7eb); stroke: var(--frog-enum-selector-stroke, #94a3b8); stroke-width: var(--frog-enum-selector-stroke-width, 1px); vector-effect: non-scaling-stroke;"
          data-frog-bind="interaction.opened style.selector_face.*" />

    <path id="selector_arrow"
          data-frog-detail="selector_arrow"
          data-frog-owner-part="selector_face"
          d="M241.113 88.615 L251.113 88.615 L246.113 96.615 Z"
          style="display: var(--frog-enum-selector-display, inline); fill: var(--frog-enum-selector-symbol, #111111);"
          data-frog-bind="style.selector_face.symbol_color" />
  </g>
</svg>
