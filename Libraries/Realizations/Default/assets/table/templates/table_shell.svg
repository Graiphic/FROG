<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" data-frog-template="frog.realizations.default.table.shell">
  <title>FROG Default Table Geometry Shell</title>
  <desc>Default Table shell publishing stable anchors and geometry surfaces. Headers, cells, selection, editing, and scrollbar thumbs are host overlays driven by .frog instance data.</desc>
  <g data-frog-part="root">
    <text data-frog-part="label" data-frog-anchor="label.anchor" x="16" y="22"></text>
    <text data-frog-part="caption" data-frog-anchor="caption.anchor" x="16" y="48"></text>
    <g data-frog-part="frame">
      <rect x="14" y="64" width="592" height="314" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="header_region">
      <rect x="28" y="82" width="540" height="34" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="column_header_region">
      <rect x="78" y="82" width="470" height="34" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="row_header_region">
      <rect x="28" y="116" width="50" height="238" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="grid_region">
      <rect x="28" y="82" width="540" height="272" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="body_region">
      <rect x="78" y="116" width="470" height="238" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="row"></g>
    <g data-frog-part="cell"></g>
    <g data-frog-part="selection_face"></g>
    <g data-frog-part="active_cell"></g>
    <g data-frog-part="edit_overlay"></g>
    <g data-frog-part="sort_indicator"></g>
    <g data-frog-part="resize_handle"></g>
    <g data-frog-part="vertical_scrollbar">
      <rect x="574" y="82" width="18" height="272" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="horizontal_scrollbar">
      <rect x="28" y="360" width="540" height="18" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="focus_ring">
      <rect x="10" y="60" width="600" height="318" fill="none" stroke="none"/>
    </g>
  </g>
</svg>
