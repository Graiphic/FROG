          <rect x="0" y="0" width="150" height="34" fill="#ffffff" stroke="#e2e8f0"/>
          <text x="12" y="22" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">cell</text>
        </g>
      </g>
      <rect x="0" y="34" width="460" height="34" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="0" y="68" width="460" height="34" fill="#ffffff" stroke="#e2e8f0"/>
