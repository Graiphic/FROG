<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 460 280"
     preserveAspectRatio="none"
     role="img"
     aria-label="FROG default rectangular frame realization template"
     data-frog-template="frog.realizations.default.frame.rectangular"
     data-frog-target-class="frog.widgets.frame"
     data-frog-variant="rectangular"
     style="overflow: visible;">
  <title>FROG Default Rectangular Frame Realization Template</title>
  <desc>
    Simple rectangular support frame. The host or IDE scales the rectangle to the
    .frog layout while preserving uniform border thickness through non-scaling stroke.
  </desc>

  <defs>
    <style>
      :root {
        --frog-frame-background-display: inline;
        --frog-frame-background-fill: transparent;
        --frog-frame-border-display: inline;
        --frog-frame-border-stroke: #6b7280;
        --frog-frame-border-stroke-width: 1px;
      }

      #background {
        display: var(--frog-frame-background-display);
        fill: var(--frog-frame-background-fill);
      }

      #border {
        display: var(--frog-frame-border-display);
        fill: none;
        stroke: var(--frog-frame-border-stroke);
        stroke-width: var(--frog-frame-border-stroke-width);
        stroke-linejoin: miter;
        shape-rendering: geometricPrecision;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <rect id="background"
          data-frog-part="background"
          x="0"
          y="0"
          width="460"
          height="280"
          data-frog-bind="style.background.*" />

    <rect id="border"
          data-frog-part="border"
          x="0"
          y="0"
          width="460"
          height="280"
          vector-effect="non-scaling-stroke"
          data-frog-bind="style.border.*" />
  </g>
</svg>
