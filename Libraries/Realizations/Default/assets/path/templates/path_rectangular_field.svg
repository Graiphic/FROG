<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 150"
     preserveAspectRatio="none"
     role="img"
     aria-label="FROG default path rectangular field realization template"
     data-frog-template="frog.realizations.default.path.rectangular_field"
     data-frog-target-classes="frog.widgets.path_control frog.widgets.path_indicator"
     data-frog-variant="rectangular_field">
  <title>FROG Default Path Rectangular Field Realization Template</title>
  <desc>
    Semantic SVG template for the default path field realization.
    The runtime or IDE binds value and path display state to dynamic path_display.
  </desc>

  <defs>
    <style>
      :root {
        --frog-path-label-display: none;
        --frog-path-caption-display: inline;
        --frog-path-caption-fill: #111827;
        --frog-path-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-path-caption-font-size: 14px;
        --frog-path-caption-font-weight: 600;
        --frog-path-face-fill: #ffffff;
        --frog-path-face-stroke: #94a3b8;
        --frog-path-face-stroke-width: 1px;
        --frog-path-text-fill: #111111;
        --frog-path-text-font-size: 14px;
        --frog-path-text-font-weight: 400;
        --frog-path-button-fill: #f8fafc;
        --frog-path-button-fill-hover: #e5eef9;
        --frog-path-button-stroke: #64748b;
        --frog-path-button-stroke-hover: #64748b;
        --frog-path-button-stroke-width: 1px;
        --frog-path-button-text-fill: #111827;
        --frog-path-button-text-font-size: 22px;
        --frog-path-icon-display: none;
        --frog-path-icon-fill: #facc15;
        --frog-path-icon-front-fill: #fde68a;
        --frog-path-icon-stroke: #b45309;
        --frog-path-icon-highlight: #fff7cc;
        --frog-path-validation-display: none;
        --frog-path-overflow-display: none;
        --frog-path-browse-display: inline;
      }

      #label_text { display: var(--frog-path-label-display); fill: #6b7280; font-family: system-ui, Segoe UI, Arial, sans-serif; font-size: 12px; }
      #caption_text { display: var(--frog-path-caption-display); fill: var(--frog-path-caption-fill); font-family: var(--frog-path-caption-font-family); font-size: var(--frog-path-caption-font-size); font-weight: var(--frog-path-caption-font-weight); }
      #path_face { fill: var(--frog-path-face-fill); stroke: var(--frog-path-face-stroke); stroke-width: var(--frog-path-face-stroke-width); vector-effect: non-scaling-stroke; }
      #path_display { fill: var(--frog-path-text-fill); font-family: system-ui, Segoe UI, Arial, sans-serif; font-size: var(--frog-path-text-font-size); font-weight: var(--frog-path-text-font-weight); }
      #browse_button { display: var(--frog-path-browse-display); fill: var(--frog-path-button-fill); stroke: var(--frog-path-button-stroke); stroke-width: var(--frog-path-button-stroke-width); vector-effect: non-scaling-stroke; }
      #browse_button_text { display: var(--frog-path-browse-display); fill: var(--frog-path-button-text-fill); font-size: var(--frog-path-button-text-font-size); }
      #path_icon { display: var(--frog-path-icon-display); }
      #path_icon .folder_back { fill: var(--frog-path-icon-fill); stroke: var(--frog-path-icon-stroke); stroke-width: 1px; vector-effect: non-scaling-stroke; }
      #path_icon .folder_front { fill: var(--frog-path-icon-front-fill); stroke: var(--frog-path-icon-stroke); stroke-width: 1px; vector-effect: non-scaling-stroke; }
      #path_icon .folder_highlight { fill: var(--frog-path-icon-highlight); opacity: 0.75; }
      #text_overflow_marker { display: var(--frog-path-overflow-display); }
      #validation_marker { display: var(--frog-path-validation-display); }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="18">path_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          x="16"
          y="46">Path</text>

    <rect id="path_face"
          data-frog-part="path_face"
          x="22"
          y="78"
          width="390"
          height="36"
          rx="0"
          data-frog-bind="style.path_face.*" />

    <g id="path_icon"
       data-frog-part="path_icon"
       data-frog-bind="display.icon_visible path.kind style.path_icon.*">
      <path class="folder_back"
            d="M30 89 H38 L40 92 H51 V104 H30 Z" />
      <path class="folder_front"
            d="M31 96 H52 L49 106 H29 Z" />
      <path class="folder_highlight"
            d="M33 97 H49 L48.5 99 H33 Z" />
    </g>

    <text id="path_display"
          data-frog-part="path_display"
          data-frog-member="value path.display_value"
          data-frog-anchor="path_display.left_center"
          x="56"
          y="96"
          dominant-baseline="middle"
          data-frog-bind="value path.* display.* style.path_display.*">C:\data\file.txt</text>

    <text id="text_overflow_marker"
          data-frog-part="text_overflow_marker"
          x="398"
          y="96"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="system-ui, Segoe UI, Arial, sans-serif"
          font-size="12"
          fill="#111111"
          data-frog-bind="display.text_overflow_visible">...</text>

    <rect id="browse_button"
          data-frog-part="browse_button"
          x="424"
          y="78"
          width="34"
          height="36"
          rx="2"
          data-frog-bind="browse.enabled browse.button_visible style.browse_button.*" />

    <text id="browse_button_text"
          data-frog-part="browse_button_text"
          data-frog-member="display.browse_label"
          data-frog-anchor="browse_button.center"
          data-frog-bind="browse.button_visible display.browse_label style.browse_button.text.*"
          x="441"
          y="96"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="system-ui, Segoe UI, Arial, sans-serif"
          font-size="13">...</text>

    <g id="validation_marker"
       data-frog-part="validation_marker"
       data-frog-bind="validation.* display.validation_marker_visible">
      <circle cx="478" cy="96" r="8" fill="#22c55e" />
      <path d="M474 96 L477 100 L483 91" fill="none" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke" />
    </g>
  </g>
</svg>
