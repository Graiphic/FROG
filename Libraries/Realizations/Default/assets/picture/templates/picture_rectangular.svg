<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 520 360"
     preserveAspectRatio="none"
     data-frog-template="frog.realizations.default.picture.rectangular">
  <title>FROG Default Picture Template</title>
  <desc>Default SVG-backed picture widget realization with a caption, one image region, an image surface, optional overlays, and a focus ring.</desc>

  <g id="root" data-frog-part="root" data-frog-bind="value image.* viewport.* display.* style.* interaction.*">
    <text id="label"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          data-frog-bind="label.text label.visible label.anchor.* label.style.*"
          x="16"
          y="22"
          font-size="12"
          font-family="Inter, Arial, sans-serif"
          fill="#111827">picture_1</text>

    <text id="caption"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          x="260"
          y="48"
          text-anchor="middle"
          font-size="16"
          font-family="Inter, Arial, sans-serif"
          font-weight="600"
          fill="#111827">Picture</text>

    <rect id="frame"
          data-frog-part="frame"
          data-frog-anchor="frame.bounds"
          data-frog-bind="style.frame.*"
          x="28"
          y="74"
          width="464"
          height="260"
          rx="0"
          fill="transparent"
          stroke="transparent"
          stroke-width="0"
          vector-effect="non-scaling-stroke"/>

    <g id="picture_region"
       data-frog-part="picture_region"
       data-frog-anchor="picture_region.bounds"
       data-frog-member="viewport.*"
       data-frog-bind="value image.* viewport.* display.* style.picture_region.*">
      <rect x="28"
            y="74"
            width="464"
            height="260"
            rx="0"
            fill="#ffffff"
            stroke="#111827"
            stroke-width="1"
            vector-effect="non-scaling-stroke"/>
      <rect id="image_surface"
            data-frog-part="image_surface"
            data-frog-anchor="image_surface.bounds"
            data-frog-member="image.*"
            data-frog-bind="value image.* viewport.* display.*"
            x="29"
            y="75"
            width="462"
            height="258"
            rx="0"
            fill="#ffffff"/>
    </g>

    <g id="overlay_region"
       data-frog-part="overlay_region"
       data-frog-anchor="overlay_region.bounds"
       data-frog-member="overlay.*"
       data-frog-bind="overlay.* pointer.position"
       style="display:none"
       opacity="0.9">
      <line x1="29" y1="75" x2="491" y2="333" stroke="#2563eb" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0.22"/>
      <rect x="316" y="116" width="96" height="64" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>
      <text x="322" y="108" font-size="11" font-family="Inter, Arial, sans-serif" fill="#f97316">overlay</text>
    </g>

    <g id="roi_layer" data-frog-part="roi_layer" data-frog-member="roi.*" data-frog-bind="roi.* display.roi_visible" style="display:none">
      <rect x="110" y="132" width="164" height="106" fill="none" stroke="#22c55e" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
      <circle cx="110" cy="132" r="4" fill="#22c55e"/>
      <circle cx="274" cy="132" r="4" fill="#22c55e"/>
      <circle cx="110" cy="238" r="4" fill="#22c55e"/>
      <circle cx="274" cy="238" r="4" fill="#22c55e"/>
    </g>

    <g id="crosshair_layer" data-frog-part="crosshair_layer" data-frog-member="pointer.position" data-frog-bind="pointer.position crosshair.* display.crosshair_visible" style="display:none" opacity="0.9">
      <line x1="260" y1="75" x2="260" y2="333" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
      <line x1="29" y1="204" x2="491" y2="204" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
      <circle cx="260" cy="204" r="5" fill="none" stroke="#ef4444" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </g>

    <g id="cursor_readout" data-frog-part="cursor_readout" data-frog-member="pointer.pixel_value" data-frog-bind="pointer.pixel_value cursor_readout.visible cursor_readout.style.*" style="display:none">
      <rect x="28" y="336" width="238" height="20" rx="0" fill="#111827" opacity="0.86"/>
      <text x="40" y="350" font-size="12" font-family="Consolas, Menlo, monospace" fill="#f8fafc">x=0 y=0 rgb=(--,--,--)</text>
    </g>

    <rect id="focus_ring"
          data-frog-part="focus_ring"
          data-frog-anchor="focus_ring.bounds"
          data-frog-bind="interaction.focused style.focus_ring.*"
          x="24"
          y="70"
          width="472"
          height="268"
          fill="none"
          stroke="#2f80ed"
          stroke-width="3"
          vector-effect="non-scaling-stroke"
          opacity="0"/>
  </g>
</svg>
