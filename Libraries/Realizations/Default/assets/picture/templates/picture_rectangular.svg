<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" data-frog-template="frog.realizations.default.picture.rectangular">
  <title>FROG Default Picture Template</title>
  <desc>Default SVG-backed picture widget realization with image, overlay, ROI, crosshair, cursor readout, label, caption, frame, and focus surfaces.</desc>

  <g data-frog-part="root">
    <text data-frog-part="label" data-frog-member="label.text" x="16" y="22" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">picture_1</text>
    <text data-frog-part="caption" data-frog-member="caption.text" x="16" y="48" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#111827">Picture</text>

    <rect data-frog-part="frame" x="14" y="64" width="492" height="280" rx="10" fill="#f8fafc" stroke="#111827" stroke-width="2"/>

    <g data-frog-part="picture_region" data-frog-member="viewport.*">
      <rect x="28" y="82" width="464" height="226" rx="4" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"/>
      <rect data-frog-part="image_surface" data-frog-member="image.*" x="34" y="88" width="452" height="214" rx="3" fill="#cbd5e1"/>
      <path d="M34 302 L152 190 L224 252 L302 150 L486 302 Z" fill="#94a3b8" opacity="0.45"/>
      <circle cx="122" cy="136" r="26" fill="#f8fafc" opacity="0.65"/>
    </g>

    <g data-frog-part="overlay_region" data-frog-member="overlay.*" opacity="0.9">
      <line x1="34" y1="88" x2="486" y2="302" stroke="#2563eb" stroke-width="2" opacity="0.22"/>
      <rect x="320" y="116" width="96" height="64" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="326" y="108" font-size="11" font-family="Inter, Arial, sans-serif" fill="#f97316">overlay</text>
    </g>

    <g data-frog-part="roi_layer" data-frog-member="roi.*">
      <rect x="110" y="132" width="164" height="106" fill="none" stroke="#22c55e" stroke-width="2.5"/>
      <circle cx="110" cy="132" r="4" fill="#22c55e"/>
      <circle cx="274" cy="132" r="4" fill="#22c55e"/>
      <circle cx="110" cy="238" r="4" fill="#22c55e"/>
      <circle cx="274" cy="238" r="4" fill="#22c55e"/>
    </g>

    <g data-frog-part="crosshair_layer" data-frog-member="pointer.position" opacity="0.9">
      <line x1="248" y1="88" x2="248" y2="302" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5"/>
      <line x1="34" y1="190" x2="486" y2="190" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="248" cy="190" r="5" fill="none" stroke="#ef4444" stroke-width="2"/>
    </g>

    <g data-frog-part="cursor_readout" data-frog-member="pointer.pixel_value">
      <rect x="28" y="316" width="238" height="24" rx="4" fill="#111827" opacity="0.86"/>
      <text x="40" y="332" font-size="12" font-family="Consolas, Menlo, monospace" fill="#f8fafc">x=0 y=0 rgb=(--,--,--)</text>
    </g>

    <rect data-frog-part="focus_ring" x="10" y="60" width="500" height="348" fill="none" stroke="#2f80ed" stroke-width="3" opacity="0"/>
  </g>
</svg>
