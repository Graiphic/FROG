<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 220"
     role="img"
     aria-label="FROG default cluster shell"
     data-frog-template="frog.realizations.default.cluster.shell"
     data-frog-target-class="frog.widgets.cluster">
  <title>FROG Default Cluster Shell</title>
  <desc>Top-level shell for composing cluster subobject assets.</desc>
  <g id="root" data-frog-part="root">
    <text id="label_text" data-frog-part="label" data-frog-member="label.text" data-frog-anchor="label.anchor"
          x="14" y="18" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">cluster_1</text>
    <text id="caption_text" data-frog-part="caption" data-frog-member="caption.text" data-frog-anchor="caption.anchor"
          x="18" y="44" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="15">Cluster</text>
    <rect id="focus_ring" data-frog-part="focus_ring" x="4" y="54" width="348" height="154" rx="8"
          fill="none" stroke="#2f80ed" stroke-width="3" opacity="0" data-frog-bind="interaction.focused style.focus_ring.*" />
    <rect id="frame" data-frog-part="frame" x="12" y="62" width="332" height="138" rx="6"
          fill="#ffffff" stroke="#000000" stroke-width="2" data-frog-bind="style.frame.*" />
    <g id="field_gap" data-frog-part="field_gap" data-frog-bind="layout.field_gap" />
    <g id="slot_content_region" data-frog-slot="content_region" data-frog-part="content_region" transform="translate(24 76)" />
  </g>
</svg>
