<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 210"
     role="img" aria-label="FROG array vertical scrollbar"
     data-frog-template="frog.realizations.default.array.subobject.vertical_scrollbar">
  <title>Array Vertical Scrollbar</title>
  <g id="vertical_scrollbar" data-frog-part="vertical_scrollbar" data-frog-bind="scrollbars.vertical.*">
    <rect x="0" y="0" width="18" height="210" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" vector-effect="non-scaling-stroke" />
    <rect x="3" y="8" width="12" height="96" fill="#94a3b8" />
  </g>
</svg>
