<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 18"
     role="img" aria-label="FROG array horizontal scrollbar"
     data-frog-template="frog.realizations.default.array.subobject.horizontal_scrollbar">
  <title>Array Horizontal Scrollbar</title>
  <g id="horizontal_scrollbar" data-frog-part="horizontal_scrollbar" data-frog-bind="scrollbars.horizontal.*">
    <rect x="0" y="0" width="360" height="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" vector-effect="non-scaling-stroke" />
    <rect x="8" y="3" width="160" height="12" fill="#94a3b8" />
  </g>
</svg>
