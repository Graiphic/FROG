<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" data-frog-template="frog.realizations.default.waveform_chart.shell">
  <title>FROG Default Waveform Chart Shell</title>
  <desc>Default SVG-backed waveform chart with plot area, history region, plot layer, grid, scales, legends, cursors, thresholds, annotations, palette, scrollbars, label, caption, frame, and focus ring.</desc>
  <g data-frog-part="root">
    <text data-frog-part="label" data-frog-anchor="label.anchor" x="18" y="22" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">waveform_chart_1</text>
    <text data-frog-part="caption" data-frog-anchor="caption.anchor" x="18" y="50" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#111827">Waveform Chart</text>
    <rect data-frog-part="frame" x="14" y="66" width="672" height="344" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <g data-frog-part="plot_area"><rect x="76" y="92" width="478" height="232" fill="#f8fafc" stroke="#94a3b8" vector-effect="non-scaling-stroke"/><g data-frog-part="history_region"><rect x="76" y="92" width="478" height="232" fill="#ffffff" opacity="0.2"/></g><g data-frog-part="grid"><path d="M76 150 H554 M76 208 H554 M76 266 H554 M172 92 V324 M268 92 V324 M364 92 V324 M460 92 V324" stroke="#cbd5e1" stroke-width="1" vector-effect="non-scaling-stroke"/></g><g data-frog-part="threshold_band"><rect x="76" y="142" width="478" height="44" fill="#fde68a" opacity="0.28"/></g><g data-frog-part="plot_image_back"><rect x="76" y="92" width="478" height="232" fill="none"/></g><g data-frog-part="plot_layer"><polyline data-frog-part="plot_polyline" points="84,280 150,240 210,260 270,180 330,210 390,132 460,170 540,108" fill="none" stroke="#2563eb" stroke-width="3" vector-effect="non-scaling-stroke"/><circle data-frog-part="plot_marker" cx="390" cy="132" r="4" fill="#2563eb"/></g><g data-frog-part="annotation_layer"><text x="406" y="124" font-size="11" font-family="Inter, Arial, sans-serif" fill="#334155">peak</text></g><g data-frog-part="cursor_layer"><line x1="390" y1="92" x2="390" y2="324" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/></g><g data-frog-part="cursor_readout"><rect x="400" y="94" width="112" height="24" rx="4" fill="#111827" opacity="0.85"/><text x="410" y="110" font-size="11" font-family="Consolas, monospace" fill="#f8fafc">x=6 y=42</text></g><g data-frog-part="plot_image_middle"><rect x="76" y="92" width="478" height="232" fill="none"/></g><g data-frog-part="plot_image_front"><rect x="76" y="92" width="478" height="232" fill="none"/></g></g>
    <g data-frog-part="x_scale"><line x1="76" y1="334" x2="554" y2="334" stroke="#111827" vector-effect="non-scaling-stroke"/><g data-frog-part="axis_tick"><line x1="172" y1="328" x2="172" y2="340" stroke="#111827" vector-effect="non-scaling-stroke"/></g><text data-frog-part="x_scale_label" x="296" y="368" font-size="12" font-family="Inter, Arial, sans-serif">time</text></g>
    <g data-frog-part="y_scale"><line x1="66" y1="92" x2="66" y2="324" stroke="#111827" vector-effect="non-scaling-stroke"/><text data-frog-part="y_scale_label" transform="translate(28 230) rotate(-90)" font-size="12" font-family="Inter, Arial, sans-serif">value</text></g>
    <g data-frog-part="plot_legend"><rect x="570" y="92" width="96" height="50" rx="5" fill="#f8fafc" stroke="#cbd5e1" vector-effect="non-scaling-stroke"/><line x1="584" y1="112" x2="610" y2="112" stroke="#2563eb" stroke-width="3" vector-effect="non-scaling-stroke"/><text x="618" y="116" font-size="11" font-family="Inter, Arial, sans-serif">Plot 0</text></g>
    <g data-frog-part="scale_legend"><rect x="570" y="150" width="96" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" vector-effect="non-scaling-stroke"/><text x="584" y="174" font-size="11" font-family="Inter, Arial, sans-serif">X/Y scales</text></g>
    <g data-frog-part="cursor_legend"><rect x="570" y="196" width="96" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" vector-effect="non-scaling-stroke"/><text x="584" y="220" font-size="11" font-family="Inter, Arial, sans-serif">Cursor</text></g>
    <g data-frog-part="graph_palette"><rect x="570" y="246" width="96" height="34" rx="5" fill="#eef2ff" stroke="#818cf8" vector-effect="non-scaling-stroke"/><text x="588" y="268" font-size="11" font-family="Inter, Arial, sans-serif">zoom pan</text></g>
    <g data-frog-part="x_scrollbar"><rect x="76" y="384" width="478" height="14" rx="7" fill="#e2e8f0" stroke="#94a3b8" vector-effect="non-scaling-stroke"/><rect x="196" y="387" width="160" height="8" rx="4" fill="#94a3b8"/></g>
    <g data-frog-part="y_scrollbar"><rect x="648" y="286" width="14" height="86" rx="7" fill="#e2e8f0" stroke="#94a3b8" vector-effect="non-scaling-stroke"/><rect x="651" y="312" width="8" height="32" rx="4" fill="#94a3b8"/></g>
    <rect data-frog-part="focus_ring" x="10" y="62" width="680" height="352" rx="10" fill="none" stroke="#2f80ed" stroke-width="3" vector-effect="non-scaling-stroke" opacity="0"/>
  </g>
</svg>
