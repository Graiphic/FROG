<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 108 56"
     role="img"
     aria-label="FROG waveform chart scale legend"
     data-frog-template="frog.realizations.default.waveform_chart.subobject.scale_legend"
     data-frog-target-part="scale_legend">
  <title>Scale Legend Subobject</title>
  <g id="scale_legend" data-frog-part="scale_legend" data-frog-bind="legends.scale.*">
    <rect width="108" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="10" y="22" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Time</text>
    <text x="10" y="44" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Amplitude</text>
  </g>
</svg>
