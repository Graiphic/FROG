<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 96 222"
     role="img"
     aria-label="FROG waveform chart plot legend"
     data-frog-template="frog.realizations.default.waveform_chart.subobject.plot_legend"
     data-frog-target-part="plot_legend">
  <title>Plot Legend Subobject</title>
  <g id="plot_legend" data-frog-part="plot_legend" data-frog-bind="legends.plot.*">
    <rect width="96" height="222" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="10" y="24" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Plot 0</text>
    <line x1="56" y1="20" x2="86" y2="20" stroke="#2563eb" stroke-width="3" />
    <text x="10" y="48" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Plot 1</text>
    <line x1="56" y1="44" x2="86" y2="44" stroke="#ef4444" stroke-width="3" />
    <text x="10" y="72" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Plot 2</text>
    <line x1="56" y1="68" x2="86" y2="68" stroke="#22c55e" stroke-width="3" />
  </g>
</svg>
