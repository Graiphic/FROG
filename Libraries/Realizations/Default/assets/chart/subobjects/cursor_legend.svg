<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 108 66"
     role="img"
     aria-label="FROG waveform chart cursor legend"
     data-frog-template="frog.realizations.default.waveform_chart.subobject.cursor_legend"
     data-frog-target-part="cursor_legend">
  <title>Cursor Legend Subobject</title>
  <g id="cursor_legend" data-frog-part="cursor_legend" data-frog-bind="legends.cursor.*">
    <rect width="108" height="66" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <text x="10" y="20" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="12">Cursors</text>
    <line x1="10" y1="34" x2="98" y2="34" stroke="#cbd5e1" />
    <text x="10" y="54" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="11">X</text>
    <text x="58" y="54" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="11">Y</text>
  </g>
</svg>
