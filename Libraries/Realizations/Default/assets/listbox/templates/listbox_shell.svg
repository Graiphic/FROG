<svg data-frog-template="frog.realizations.default.listbox.shell" xmlns="http://www.w3.org/2000/svg" width="262" height="244" viewBox="0 0 262 244" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Listbox</title>
<desc id="svg-desc">Une liste avec sélection et défilement.</desc>
<g data-frog-part="root" fill="#1e2936" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<g data-frog-part="main_body"><g data-frog-part="item_region"><rect data-frog-part="placement_bounds" x="0.5" y="0.5" width="261" height="243" fill="#ffffff" id="listbox-background" rx="6"/><rect x="8" y="76" width="234" height="30" fill="#e5f1fc" id="listbox-selection-background" data-frog-part="selection_face" rx="4"/><rect x="9" y="84" width="2.5" height="14" fill="#286da8" id="listbox-selection-mark" data-frog-part="focus_ring" rx="1.25"/><g data-frog-part="item_row" id="listbox-item-text" ><text id="listbox-item-text-glyph" data-frog-part="item_label" fill="#1e2936" x="21" y="32" >Température</text>
<text x="21" y="64" >Pression</text>
<text x="21" y="96" font-weight="600" fill="#17466f">Débit</text>
<text x="21" y="128" >Niveau</text>
<text x="21" y="160" >Conductivité</text>
<text x="21" y="192" >Humidité</text>
<text x="21" y="224" >Vibration</text></g><rect x="250" y="13" width="6" height="218" fill="#f3f6f9" id="listbox-scroll-track" data-frog-part="vertical_scrollbar" rx="3"/><rect x="250" y="34" width="6" height="79" fill="#9eafbf" id="listbox-scroll-thumb" rx="3"/><rect x="0.5" y="0.5" width="261" height="243" fill="none" id="listbox-border" rx="6" stroke="#bdc9d4"/>
<g data-frog-part="hover_face" opacity="0"><rect x="8" y="12" width="234" height="30" rx="4" fill="#e5f1fc"/></g><g data-frog-part="disabled_face" opacity="0"><rect x="8" y="12" width="234" height="30" rx="4" fill="#e5e7eb"/></g><g data-frog-part="horizontal_scrollbar" opacity="0"><rect x="8" y="234" width="234" height="6" rx="3" fill="#f3f6f9"/></g><g data-frog-part="label"/><g data-frog-part="caption"/><g data-frog-part="item_icon"/></g></g></g>
</svg>
