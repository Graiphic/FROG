<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" data-frog-template="frog.realizations.default.listbox.shell">
  <title>FROG Default Listbox Shell</title>
  <desc>Default SVG-backed listbox widget realization with items, selection, active item, hover, disabled state, search highlight, scrollbars, label, caption, frame, and focus surfaces.</desc>
  <g data-frog-part="root">
    <text data-frog-part="label" x="16" y="22" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">listbox_1</text>
    <text data-frog-part="caption" x="16" y="48" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#111827">Listbox</text>
    <rect data-frog-part="frame" x="14" y="64" width="432" height="232" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>

    <g data-frog-part="item_region">
      <rect x="28" y="82" width="374" height="176" fill="#f8fafc" stroke="#cbd5e1"/>
      <g data-frog-part="item_row">
        <rect x="34" y="88" width="356" height="32" fill="#ffffff" stroke="#e2e8f0"/>
        <g data-frog-part="item_icon"><rect x="46" y="96" width="16" height="16" rx="3" fill="#60a5fa" stroke="#2563eb"/></g>
        <text data-frog-part="item_label" x="74" y="109" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">Item A</text>
      </g>
      <rect data-frog-part="selection_face" x="34" y="124" width="356" height="32" fill="#bfdbfe" stroke="#2563eb" opacity="0.55"/>
      <rect data-frog-part="active_item" x="34" y="88" width="356" height="32" fill="none" stroke="#22c55e" stroke-width="2"/>
      <rect data-frog-part="hover_face" x="34" y="160" width="356" height="32" fill="#e0f2fe" stroke="#38bdf8" opacity="0.55"/>
      <rect data-frog-part="disabled_face" x="34" y="196" width="356" height="32" fill="#e5e7eb" opacity="0.66"/>
      <g data-frog-part="search_highlight"><rect x="72" y="132" width="54" height="16" fill="#fde68a" opacity="0.72"/></g>
      <g data-frog-part="empty_state" opacity="0">
        <text x="150" y="174" font-size="13" font-family="Inter, Arial, sans-serif" fill="#64748b">No items</text>
      </g>
    </g>

    <g data-frog-part="vertical_scrollbar">
      <rect x="408" y="82" width="18" height="176" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="411" y="110" width="12" height="58" rx="6" fill="#94a3b8"/>
    </g>

    <g data-frog-part="horizontal_scrollbar">
      <rect x="28" y="264" width="374" height="16" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
      <rect x="78" y="267" width="120" height="10" rx="5" fill="#94a3b8"/>
    </g>

    <rect data-frog-part="focus_ring" x="10" y="60" width="440" height="240" rx="10" fill="none" stroke="#2f80ed" stroke-width="3" opacity="0"/>
  </g>
</svg>
