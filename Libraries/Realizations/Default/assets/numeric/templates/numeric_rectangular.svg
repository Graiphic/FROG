<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 220 88"
     role="img"
     aria-label="FROG default numeric rectangular realization template"
     data-frog-template="frog.realizations.default.numeric.rectangular"
     data-frog-target-classes="frog.widgets.numeric_control frog.widgets.numeric_indicator"
     data-frog-variant="rectangular">
  <title>FROG Default Numeric Rectangular Realization Template</title>
  <desc>
    Semantic SVG template for the default rectangular realization variant of FROG numeric widgets.
    The runtime or IDE binds public widget properties to stable parts declared by id and data-frog-part.
    Compact numeric geometry follows a LabVIEW NXG-like proportion rule:
    a 96x32 grid-positioned placement aura, a centered 24 unit body height,
    73 unit value face, 2 unit value-to-spinner gap, 13 unit
    increment/decrement buttons, 2 unit vertical button gap, two equal 11 unit
    button surfaces, and a uniform 4 unit aura band around the main body.
    The non-visible placement_bounds part declares the placement aura used by
    IDE/front-panel/container layout; its top-left and top-right snap to the
    grid and its width is grid-pitch controlled, while its height follows body
    plus aura padding.
    control_body and indicator_body describe the centered visible body inside
    that aura. The aura is not focus, selection, or a rendered frame.
  </desc>

  <defs>
    <style>
      :root {
        --frog-numeric-label-display: none;
        --frog-numeric-label-fill: #6b7280;
        --frog-numeric-label-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-numeric-label-font-size: 12px;

        --frog-numeric-caption-display: inline;
        --frog-numeric-caption-fill: #2B3033;
        --frog-numeric-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-numeric-caption-font-size: 20px;
        --frog-numeric-caption-font-weight: 400;

        --frog-numeric-value-face-fill: #ffffff;
        --frog-numeric-value-face-stroke: #A8ABAE;
        --frog-numeric-value-face-stroke-width: 1px;
        --frog-numeric-value-face-width: 73px;
        --frog-numeric-value-face-transform: none;
        --frog-numeric-text-value-transform: none;

        --frog-numeric-text-display: inline;
        --frog-numeric-text-fill: #111111;
        --frog-numeric-text-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-numeric-text-font-size: 13px;

        --frog-numeric-spinner-display: inline;
        --frog-numeric-spinner-fill: #DDE1E4;
        --frog-numeric-spinner-stroke: #2B3033;
        --frog-numeric-spinner-border: #A8ABAE;
        --frog-numeric-spinner-symbol: #2B3033;
        --frog-numeric-spinner-fill-pressed: #D2D4D5;
        --frog-numeric-spinner-stroke-pressed: #2B3033;
        --frog-numeric-spinner-transform: none;
        --frog-numeric-focus-display: none;
        --frog-numeric-focus-stroke: #2f80ed;
        --frog-numeric-focus-stroke-width: 3px;
      }

      #label_text {
        display: var(--frog-numeric-label-display);
        fill: var(--frog-numeric-label-fill);
        font-family: var(--frog-numeric-label-font-family);
        font-size: var(--frog-numeric-label-font-size);
      }

      #caption_text {
        display: var(--frog-numeric-caption-display);
        fill: var(--frog-numeric-caption-fill);
        font-family: var(--frog-numeric-caption-font-family);
        font-size: var(--frog-numeric-caption-font-size);
        font-weight: var(--frog-numeric-caption-font-weight);
      }

      #value_face {
        fill: var(--frog-numeric-value-face-fill);
        stroke: var(--frog-numeric-value-face-stroke);
        stroke-width: var(--frog-numeric-value-face-stroke-width);
        width: var(--frog-numeric-value-face-width);
        transform: var(--frog-numeric-value-face-transform);
        vector-effect: non-scaling-stroke;
      }

      #text_value {
        display: var(--frog-numeric-text-display);
        fill: var(--frog-numeric-text-fill);
        font-family: var(--frog-numeric-text-font-family);
        font-size: var(--frog-numeric-text-font-size);
        transform: var(--frog-numeric-text-value-transform);
      }

      #spinner {
        display: var(--frog-numeric-spinner-display);
        transform: var(--frog-numeric-spinner-transform);
      }

      #increment_up rect,
      #increment_down rect {
        fill: var(--frog-numeric-spinner-fill);
        stroke: var(--frog-numeric-spinner-border);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }

      #increment_up path,
      #increment_down path {
        fill: var(--frog-numeric-spinner-symbol);
        stroke: none;
      }

      #focus_ring {
        display: var(--frog-numeric-focus-display);
        fill: none;
        stroke: var(--frog-numeric-focus-stroke);
        stroke-width: var(--frog-numeric-focus-stroke-width);
        width: var(--frog-numeric-value-face-width);
        transform: var(--frog-numeric-value-face-transform);
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <rect id="placement_bounds"
          data-frog-part="placement_bounds"
          data-frog-bind="layout.placement_bounds.* layout.grid.*"
          x="16"
          y="48"
          width="96"
          height="32"
          fill="none"
          stroke="none"
          pointer-events="none" />

    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="18"
          y="18">numeric_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal style.caption.*"
          x="18"
          y="38">Numeric</text>

    <rect id="focus_ring"
          data-frog-part="focus_ring"
          x="20"
          y="52"
          width="73"
          height="24"
          rx="0"
          data-frog-bind="interaction.focused style.focus_ring.*" />

    <rect id="control_body"
          data-frog-part="control_body"
          x="20"
          y="52"
          width="88"
          height="24"
          fill="none"
          stroke="none"
          pointer-events="none" />

    <rect id="indicator_body"
          data-frog-part="indicator_body"
          x="20"
          y="52"
          width="88"
          height="24"
          fill="none"
          stroke="none"
          pointer-events="none" />

    <rect id="value_face"
          data-frog-part="value_face"
          x="20"
          y="52"
          width="73"
          height="24"
          rx="0"
          data-frog-bind="style.value_face.*" />

    <text id="text_value"
          data-frog-part="text_value"
          data-frog-member="value"
          data-frog-anchor="text_value.right_center"
          data-frog-bind="value style.text_value.*"
          x="89"
          y="64"
          text-anchor="end"
          dominant-baseline="middle">0</text>

    <g id="spinner"
       data-frog-part="spinner"
       data-frog-bind="display.increment_buttons_visible">
      <g id="increment_up"
         data-frog-part="increment_up"
         data-frog-states="normal pressed"
         data-frog-state-law="normal-pressed-color-only"
         data-frog-bind="style.increment_button.*">
        <rect x="95" y="52" width="13" height="11" />
        <path d="M98 59 L104 59 L101 56 Z" fill="var(--frog-numeric-spinner-symbol)" stroke="none" />
      </g>
      <g id="increment_down"
         data-frog-part="increment_down"
         data-frog-states="normal pressed"
         data-frog-state-law="normal-pressed-color-only"
         data-frog-bind="style.increment_button.*">
        <rect x="95" y="65" width="13" height="11" />
        <path d="M98 69 L104 69 L101 72 Z" fill="var(--frog-numeric-spinner-symbol)" stroke="none" />
      </g>
    </g>

  </g>
</svg>
