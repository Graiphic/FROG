<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 120"
     role="img"
     aria-label="FROG default boolean square LED realization template"
     data-frog-template="frog.realizations.default.boolean.rectangular"
     data-frog-target-classes="frog.widgets.boolean_control frog.widgets.boolean_indicator"
     data-frog-variant="rectangular">
  <title>FROG Default Boolean Square LED Realization Template</title>
  <desc>
    Minimal state-aware SVG skin for FROG boolean widgets. The boolean class remains one
    semantic object; this asset supplies the square/rectangular LED skin.
  </desc>

  <defs>
    <style>
      #label_text,
      #caption_text,
      #state_text {
        display: none;
      }

      #placement_bounds {
        display: none;
        fill: none;
        stroke: none;
      }

      #state_face {
        fill: #ffffff;
        stroke: #A8ABAE;
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
      }

      #focus_ring {
        display: none;
        fill: none;
        stroke: #00ADEF;
        stroke-width: 1px;
        vector-effect: non-scaling-stroke;
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="24">boolean_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          x="16"
          y="24">Boolean</text>

    <rect id="placement_bounds"
          data-frog-part="placement_bounds"
          x="16"
          y="32"
          width="72"
          height="72"
          data-frog-role="ide_placement_aura" />

    <rect id="state_face"
          data-frog-part="state_face"
          x="20"
          y="36"
          width="64"
          height="64"
          data-frog-bind="value style.state_face.*" />

    <rect id="focus_ring"
          data-frog-part="focus_ring"
          x="20"
          y="36"
          width="64"
          height="64"
          data-frog-bind="interaction.focused style.focus_ring.*" />

    <text id="state_text"
          data-frog-part="state_text"
          data-frog-member="state_text.true_text state_text.false_text"
          data-frog-anchor="state_text.center"
          x="52"
          y="68"
          text-anchor="middle"
          dominant-baseline="middle">On</text>
  </g>
</svg>
