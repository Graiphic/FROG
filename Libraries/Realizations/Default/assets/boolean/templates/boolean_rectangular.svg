<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 250"
     role="img"
     aria-label="FROG default boolean rectangular realization template"
     data-frog-template="frog.realizations.default.boolean.rectangular"
     data-frog-target-classes="frog.widgets.boolean_control frog.widgets.boolean_indicator"
     data-frog-variant="rectangular">
  <title>FROG Default Boolean Rectangular Realization Template</title>
  <desc>
    Semantic SVG template for the default rectangular realization variant of FROG boolean widgets.
    The runtime or IDE binds public widget properties to stable parts declared by id and data-frog-part.
  </desc>

  <defs>
    <style>
      :root {
        --frog-boolean-label-display: none;
        --frog-boolean-label-fill: #6b7280;
        --frog-boolean-label-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-boolean-label-font-size: 12px;
        --frog-boolean-label-font-weight: 400;

        --frog-boolean-caption-display: inline;
        --frog-boolean-caption-fill: #d00000;
        --frog-boolean-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-boolean-caption-font-size: 18px;
        --frog-boolean-caption-font-weight: 400;

        --frog-boolean-outer-fill: #ffffff;
        --frog-boolean-outer-stroke: #000000;
        --frog-boolean-outer-stroke-width: 8px;

        --frog-boolean-inner-fill: #ffffff;
        --frog-boolean-inner-stroke: transparent;
        --frog-boolean-inner-stroke-width: 0px;

        --frog-boolean-state-text-display: inline;
        --frog-boolean-state-text-fill: #111111;
        --frog-boolean-state-text-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-boolean-state-text-font-size: 20px;
        --frog-boolean-state-text-font-weight: 400;

        --frog-boolean-focus-display: none;
        --frog-boolean-focus-stroke: #2f80ed;
        --frog-boolean-focus-stroke-width: 3px;
        --frog-boolean-focus-opacity: 1;
      }

      #label_text {
        display: var(--frog-boolean-label-display);
        fill: var(--frog-boolean-label-fill);
        font-family: var(--frog-boolean-label-font-family);
        font-size: var(--frog-boolean-label-font-size);
        font-weight: var(--frog-boolean-label-font-weight);
      }

      #caption_text {
        display: var(--frog-boolean-caption-display);
        fill: var(--frog-boolean-caption-fill);
        font-family: var(--frog-boolean-caption-font-family);
        font-size: var(--frog-boolean-caption-font-size);
        font-weight: var(--frog-boolean-caption-font-weight);
      }

      #outer_face {
        fill: var(--frog-boolean-outer-fill);
        stroke: var(--frog-boolean-outer-stroke);
        stroke-width: var(--frog-boolean-outer-stroke-width);
      }

      #inner_face {
        fill: var(--frog-boolean-inner-fill);
        stroke: var(--frog-boolean-inner-stroke);
        stroke-width: var(--frog-boolean-inner-stroke-width);
      }

      #state_text {
        display: var(--frog-boolean-state-text-display);
        fill: var(--frog-boolean-state-text-fill);
        font-family: var(--frog-boolean-state-text-font-family);
        font-size: var(--frog-boolean-state-text-font-size);
        font-weight: var(--frog-boolean-state-text-font-weight);
      }

      #focus_ring {
        display: var(--frog-boolean-focus-display);
        fill: none;
        stroke: var(--frog-boolean-focus-stroke);
        stroke-width: var(--frog-boolean-focus-stroke-width);
        opacity: var(--frog-boolean-focus-opacity);
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="18">boolean_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          x="16"
          y="46">Boolean</text>

    <rect id="focus_ring"
          data-frog-part="focus_ring"
          x="4"
          y="64"
          width="312"
          height="154"
          rx="8"
          data-frog-bind="interaction.focused style.focus_ring.*" />

    <rect id="outer_face"
          data-frog-part="outer_face"
          x="12"
          y="72"
          width="296"
          height="138"
          rx="0"
          data-frog-bind="style.outer.fill_color.* style.outer.border_color.* style.outer.border_width style.outer.corner_radius" />

    <rect id="inner_face"
          data-frog-part="inner_face"
          x="32"
          y="92"
          width="256"
          height="98"
          rx="0"
          data-frog-bind="style.inner.visible.* style.inner.fill_color.* style.inner.border_color.* style.inner.border_width style.inner.corner_radius style.inner.inset" />

    <text id="state_text"
          data-frog-part="state_text"
          data-frog-member="state_text.true_text state_text.false_text"
          data-frog-anchor="state_text.center"
          x="160"
          y="144"
          text-anchor="middle"
          dominant-baseline="middle">TRUE</text>
  </g>
</svg>
