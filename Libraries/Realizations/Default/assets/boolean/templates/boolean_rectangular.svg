<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 80"
     role="img"
     aria-label="FROG default boolean rectangular realization template"
     data-frog-template="frog.realizations.default.boolean.rectangular"
     data-frog-target-classes="frog.widgets.boolean_control frog.widgets.boolean_indicator"
     data-frog-variant="rectangular">
  <title>FROG Default Boolean Rectangular Realization Template</title>
  <desc>
    Semantic SVG template for the default rectangular realization variant of FROG boolean widgets.
    The runtime or IDE binds public widget properties to stable parts declared by id and data-frog-part.
    Example 06 renders caption and state text through host overlays, so template text is hidden by default.
  </desc>

  <defs>
    <style>
      #label_text {
        display: none;
        fill: #6b7280;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        font-size: 12px;
      }

      #caption_text {
        display: none;
        fill: #1f2933;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
      }

      #outer_face {
        fill: #ffffff;
        stroke: #111827;
        stroke-width: 4px;
      }

      #inner_face {
        fill: #f8fafc;
        stroke: #cbd5e1;
        stroke-width: 1px;
      }

      #state_text {
        display: none;
        fill: #111827;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
      }

      #focus_ring {
        display: none;
        fill: none;
        stroke: #2f80ed;
        stroke-width: 2px;
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="10"
          y="14">boolean_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          x="10"
          y="17">Boolean</text>

    <rect id="focus_ring"
          data-frog-part="focus_ring"
          x="4"
          y="18"
          width="152"
          height="58"
          rx="9"
          data-frog-bind="interaction.focused style.focus_ring.*" />

    <rect id="outer_face"
          data-frog-part="outer_face"
          x="8"
          y="22"
          width="144"
          height="52"
          rx="8"
          data-frog-bind="style.outer.fill_color.* style.outer.border_color.* style.outer.border_width style.outer.corner_radius" />

    <rect id="inner_face"
          data-frog-part="inner_face"
          x="18"
          y="32"
          width="124"
          height="32"
          rx="5"
          data-frog-bind="style.inner.visible.* style.inner.fill_color.* style.inner.border_color.* style.inner.border_width style.inner.corner_radius style.inner.inset" />

    <text id="state_text"
          data-frog-part="state_text"
          data-frog-member="state_text.true_text state_text.false_text"
          data-frog-anchor="state_text.center"
          x="80"
          y="48"
          text-anchor="middle"
          dominant-baseline="middle">TRUE</text>
  </g>
</svg>
