<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 80"
     role="img"
     aria-label="FROG default boolean circular realization template"
     data-frog-template="frog.realizations.default.boolean.circular"
     data-frog-target-classes="frog.widgets.boolean_control frog.widgets.boolean_indicator"
     data-frog-variant="circular">
  <title>FROG Default Boolean Circular Realization Template</title>
  <desc>
    State-aware structural SVG template for the default circular realization variant of FROG boolean widgets.
    Runtime hosts bind public widget properties to stable data-frog-part surfaces and apply false, true,
    hover, focused, disabled, and transition visual states while preserving indicator read-only semantics.
  </desc>

  <defs>
    <style>
      #label_text,
      #caption_text,
      #state_text {
        display: none;
      }

      #frame_shadow {
        fill: transparent;
        opacity: 0;
      }

      #outer_face {
        fill: none;
        stroke: transparent;
        stroke-width: 3px;
      }

      #inner_face {
        fill: none;
        stroke: transparent;
        stroke-width: 1px;
      }

      #focus_ring {
        display: none;
        fill: none;
        stroke: #2563eb;
        stroke-width: 2px;
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="8"
          y="13">boolean_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          x="8"
          y="15">Boolean</text>

    <circle id="focus_ring"
            data-frog-part="focus_ring"
            cx="80"
            cy="50"
            r="30"
            data-frog-bind="interaction.focused style.focus_ring.*" />

    <circle id="frame_shadow"
            data-frog-part="frame"
            cx="80"
            cy="50"
            r="28"
            data-frog-bind="style.frame.visible style.frame.fill_color.* style.frame.opacity.*" />

    <circle id="outer_face"
            data-frog-part="outer_face"
            cx="80"
            cy="50"
            r="28"
            data-frog-bind="style.outer.fill_color.* style.outer.border_color.* style.outer.border_width" />

    <circle id="inner_face"
            data-frog-part="inner_face"
            cx="80"
            cy="50"
            r="19"
            data-frog-bind="style.inner.visible.* style.inner.fill_color.* style.inner.border_color.* style.inner.border_width style.inner.inset" />

    <text id="state_text"
          data-frog-part="state_text"
          data-frog-member="state_text.true_text state_text.false_text"
          data-frog-anchor="state_text.center"
          x="80"
          y="50"
          text-anchor="middle"
          dominant-baseline="middle">TRUE</text>
  </g>
</svg>
