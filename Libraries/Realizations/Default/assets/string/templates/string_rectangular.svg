<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 190"
     role="img"
     aria-label="FROG default string rectangular realization template"
     data-frog-skin-contract="semantic_svg_skin_v1"
     data-frog-template="frog.realizations.default.string.rectangular"
     data-frog-target-classes="frog.widgets.string_control frog.widgets.string_indicator"
     data-frog-variant="rectangular"
     data-frog-resize="scale_to_front_panel_layout_rectangle">
  <title>FROG Default String Rectangular Realization Template</title>
  <desc>
    Semantic SVG template for the default rectangular realization variant of FROG string widgets.
    The runtime or IDE binds public widget properties to stable parts declared by id and data-frog-part.
  </desc>
  <metadata id="frog_semantic_skin_contract"
            data-frog-kind="semantic_svg_skin_contract"
            data-frog-contract-version="0.1">
    {
      "template": "frog.realizations.default.string.rectangular",
      "skin_contract": "semantic_svg_skin_v1",
      "target_classes": [
        "frog.widgets.string_control",
        "frog.widgets.string_indicator"
      ],
      "parts": [
        {
          "part": "root",
          "role": "coordinate_space",
          "resize": "scale_to_front_panel_layout_rectangle",
          "solidary_group": "whole_string_widget"
        },
        {
          "part": "label",
          "member": "label.text",
          "anchor": "label.anchor",
          "resize": "anchored_text",
          "runtime_surface": "logical_label_preview_hidden_by_runtime"
        },
        {
          "part": "caption",
          "member": "caption.text",
          "anchor": "caption.anchor",
          "resize": "anchored_text",
          "runtime_surface": "host_caption_overlay"
        },
        {
          "part": "text_region",
          "style_group": "style.text_region",
          "resize": "stretch_surface",
          "border_policy": "uniform_non_scaling_stroke",
          "crop_reference": true
        },
        {
          "part": "text_value",
          "member": "value",
          "anchor": "text_region.left_center",
          "resize": "stretch_dynamic_text_region",
          "runtime_surface": "host_string_value_overlay"
        },
        {
          "part": "placeholder",
          "member": "placeholder.text",
          "anchor": "text_region.left_center",
          "resize": "stretch_dynamic_text_region",
          "visibility_member": "placeholder.visible",
          "runtime_surface": "optional_host_placeholder_overlay"
        }
      ]
    }
  </metadata>

  <defs>
    <style>
      :root {
        --frog-string-label-display: none;
        --frog-string-label-fill: #6b7280;
        --frog-string-label-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-string-label-font-size: 12px;
        --frog-string-label-font-weight: 400;

        --frog-string-caption-display: inline;
        --frog-string-caption-fill: #d00000;
        --frog-string-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-string-caption-font-size: 18px;
        --frog-string-caption-font-weight: 400;

        --frog-string-text-region-fill: #5b9bd5;
        --frog-string-text-region-stroke: transparent;
        --frog-string-text-region-stroke-width: 0px;

        --frog-string-text-fill: #111111;
        --frog-string-text-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-string-text-font-size: 20px;
        --frog-string-text-font-weight: 400;

        --frog-string-placeholder-display: none;
        --frog-string-placeholder-fill: #6b7280;
      }

      #label_text {
        display: var(--frog-string-label-display);
        fill: var(--frog-string-label-fill);
        font-family: var(--frog-string-label-font-family);
        font-size: var(--frog-string-label-font-size);
        font-weight: var(--frog-string-label-font-weight);
      }

      #caption_text {
        display: var(--frog-string-caption-display);
        fill: var(--frog-string-caption-fill);
        font-family: var(--frog-string-caption-font-family);
        font-size: var(--frog-string-caption-font-size);
        font-weight: var(--frog-string-caption-font-weight);
      }

      #text_region {
        fill: var(--frog-string-text-region-fill);
        stroke: var(--frog-string-text-region-stroke);
        stroke-width: var(--frog-string-text-region-stroke-width);
        vector-effect: non-scaling-stroke;
      }

      #text_value {
        fill: var(--frog-string-text-fill);
        font-family: var(--frog-string-text-font-family);
        font-size: var(--frog-string-text-font-size);
        font-weight: var(--frog-string-text-font-weight);
      }

      #placeholder {
        display: var(--frog-string-placeholder-display);
        fill: var(--frog-string-placeholder-fill);
        font-family: var(--frog-string-text-font-family);
        font-size: var(--frog-string-text-font-size);
      }

    </style>
  </defs>

  <g id="root"
     data-frog-part="root"
     data-frog-role="coordinate_space"
     data-frog-resize="scale_to_front_panel_layout_rectangle"
     data-frog-solidary-group="whole_string_widget">
    <text id="label_text"
          data-frog-part="label"
          data-frog-role="logical_label_preview"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          data-frog-resize="anchored_text"
          data-frog-solidary-group="label_overlay"
          data-frog-runtime-surface="preview_hidden_by_host_overlay"
          x="16"
          y="18">string_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-role="visible_caption_preview"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          data-frog-resize="anchored_text"
          data-frog-solidary-group="caption_overlay"
          data-frog-runtime-surface="host_caption_overlay"
          data-frog-runtime-preview="hidden_when_host_projects_caption"
          x="28"
          y="64">String</text>

    <rect id="text_region"
          data-frog-part="text_region"
          data-frog-role="editable_text_region"
          x="15"
          y="75"
          width="390"
          height="58"
          rx="0"
          data-frog-bind="style.text_region.fill_color style.text_region.fill_color.hover style.text_region.border_color style.text_region.border_color.hover style.text_region.border_width style.text_region.border_width.hover style.text_region.inset"
          data-frog-resize="stretch_surface"
          data-frog-solidary-group="field_body"
          data-frog-border-policy="uniform_non_scaling_stroke"
          data-frog-crop-reference="true" />

    <text id="placeholder"
          data-frog-part="placeholder"
          data-frog-role="optional_placeholder_text"
          data-frog-member="placeholder.text"
          data-frog-anchor="text_region.left_center"
          data-frog-bind="placeholder.text placeholder.visible placeholder.style.*"
          data-frog-resize="stretch_dynamic_text_region"
          data-frog-solidary-group="field_value_text"
          data-frog-visibility-member="placeholder.visible"
          data-frog-runtime-surface="optional_host_placeholder_overlay"
          data-frog-runtime-preview="hidden_when_host_projects_placeholder"
          x="44"
          y="104"
          dominant-baseline="middle">placeholder</text>

    <text id="text_value"
          data-frog-part="text_value"
          data-frog-role="dynamic_string_value_text_region"
          data-frog-member="value"
          data-frog-anchor="text_region.left_center"
          data-frog-bind="value text.* style.text.*"
          data-frog-resize="stretch_dynamic_text_region"
          data-frog-solidary-group="field_value_text"
          data-frog-runtime-surface="host_string_value_overlay"
          data-frog-runtime-preview="hidden_when_host_projects_value"
          x="44"
          y="104"
          dominant-baseline="middle">TEXT</text>
  </g>
</svg>
