<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 96"
     preserveAspectRatio="none"
     role="img"
     aria-label="FROG default label rectangular realization template"
     data-frog-template="frog.realizations.default.label.rectangular"
     data-frog-target-class="frog.widgets.label"
     data-frog-variant="rectangular">
  <title>FROG Default Label Rectangular Realization Template</title>
  <desc>Semantic SVG template for standalone FROG label widgets.</desc>

  <g id="root" data-frog-part="root">
    <rect id="background" data-frog-part="background" x="4" y="4" width="352" height="88" rx="0" fill="#ffffff" opacity="0" data-frog-bind="style.background.*" />
    <rect id="frame" data-frog-part="frame" x="4" y="4" width="352" height="88" rx="0" fill="none" stroke="#94a3b8" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0" data-frog-bind="style.frame.*" />
    <text id="text_surface" data-frog-part="text_surface" data-frog-member="text.value" data-frog-anchor="text_surface.left_center" x="16" y="50" dominant-baseline="middle" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="16" fill="#111111" data-frog-bind="text.value style.text.*">Label text</text>
    <rect id="focus_ring" data-frog-part="focus_ring" x="2" y="2" width="356" height="92" rx="0" fill="none" stroke="#2f80ed" stroke-width="2" vector-effect="non-scaling-stroke" opacity="0" data-frog-bind="interaction.focused style.focus_ring.*" />
  </g>
</svg>
