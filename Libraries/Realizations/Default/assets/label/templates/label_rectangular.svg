<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 96"
     preserveAspectRatio="none"
     role="img"
     aria-label="FROG default label rectangular realization template"
     data-frog-template="frog.realizations.default.label.rectangular"
     data-frog-target-class="frog.widgets.label"
     data-frog-variant="rectangular">
  <title>FROG Default Label Rectangular Realization Template</title>
  <desc>Minimal semantic SVG template for standalone static text labels.</desc>

  <g id="root" data-frog-part="root">
    <rect id="placement_bounds"
          data-frog-part="placement_bounds"
          x="0"
          y="0"
          width="360"
          height="96"
          fill="none"
          opacity="0"
          data-frog-bind="layout.placement_bounds.*" />
    <text id="text_surface"
          data-frog-part="text_surface"
          data-frog-member="text.value"
          data-frog-anchor="text_surface.left_center"
          x="4"
          y="48"
          dominant-baseline="middle"
          font-family="system-ui, Segoe UI, Arial, sans-serif"
          font-size="16"
          fill="#111111"
          data-frog-bind="text.value style.text.*">Label text</text>
  </g>
</svg>
