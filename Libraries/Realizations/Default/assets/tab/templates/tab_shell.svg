<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" data-frog-template="frog.realizations.default.tab.shell">
  <title>FROG Default Tab Shell</title>
  <desc>Default SVG-backed tab widget realization with tab header, items, selection, overflow, close, scroll, page container, label, caption, frame, and focus surfaces.</desc>
  <g data-frog-part="root">
    <text data-frog-part="label" x="16" y="22" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">tab_1</text>
    <text data-frog-part="caption" x="16" y="48" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600" fill="#111827">Tab Control</text>
    <rect data-frog-part="frame" x="14" y="64" width="532" height="260" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <g data-frog-part="tab_header_region">
      <rect x="24" y="74" width="512" height="42" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
      <g data-frog-part="tab_scroll_previous"><rect x="30" y="82" width="24" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/><path d="M45 88 L38 95 L45 102 Z" fill="#334155"/></g>
      <g data-frog-part="tab_item"><rect x="60" y="78" width="128" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/><g data-frog-part="tab_item_icon"><rect x="72" y="88" width="14" height="14" rx="3" fill="#60a5fa" stroke="#2563eb"/></g><text data-frog-part="tab_item_label" x="94" y="101" font-size="12" font-family="Inter, Arial, sans-serif" fill="#111827">Page A</text><g data-frog-part="tab_close_button"><circle cx="174" cy="96" r="7" fill="#f1f5f9" stroke="#94a3b8"/><path d="M171 93 L177 99 M177 93 L171 99" stroke="#334155" stroke-width="1.4"/></g></g>
      <rect data-frog-part="selection_face" x="60" y="78" width="128" height="36" rx="6" fill="#bfdbfe" stroke="#2563eb" opacity="0.55"/>
      <g data-frog-part="tab_scroll_next"><rect x="462" y="82" width="24" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/><path d="M471 88 L478 95 L471 102 Z" fill="#334155"/></g>
      <g data-frog-part="overflow_button"><rect x="494" y="82" width="32" height="26" rx="4" fill="#f8fafc" stroke="#94a3b8"/><circle cx="505" cy="95" r="1.8" fill="#334155"/><circle cx="510" cy="95" r="1.8" fill="#334155"/><circle cx="515" cy="95" r="1.8" fill="#334155"/></g>
    </g>
    <g data-frog-part="page_region"><rect x="24" y="116" width="512" height="196" rx="4" fill="#f8fafc" stroke="#cbd5e1"/><g data-frog-part="page_container"><rect x="40" y="132" width="480" height="164" rx="4" fill="#ffffff" stroke="#e2e8f0"/><g data-frog-part="page_content"><rect x="58" y="150" width="184" height="30" rx="4" fill="#e0f2fe" stroke="#38bdf8"/><rect x="58" y="194" width="264" height="30" rx="4" fill="#dcfce7" stroke="#22c55e"/><text x="72" y="170" font-size="12" font-family="Inter, Arial, sans-serif" fill="#075985">selected page content</text></g></g></g>
    <g data-frog-part="overflow_menu" opacity="0.94"><rect x="386" y="112" width="138" height="82" rx="6" fill="#111827" opacity="0.88"/><text x="402" y="136" font-size="12" font-family="Inter, Arial, sans-serif" fill="#f8fafc">Page C</text><text x="402" y="160" font-size="12" font-family="Inter, Arial, sans-serif" fill="#f8fafc">Page D</text></g>
    <rect data-frog-part="focus_ring" x="10" y="60" width="540" height="268" rx="10" fill="none" stroke="#2f80ed" stroke-width="3" opacity="0"/>
  </g>
</svg>
