<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 340 220"
     role="img"
     aria-label="FROG default rectangular button realization template"
     data-frog-template="frog.realizations.default.button.rectangular"
     data-frog-target-class="frog.widgets.button"
     data-frog-variant="rectangular">
  <title>FROG Default Rectangular Button Realization Template</title>
  <desc>
    Minimal semantic SVG skin for the default FROG button widget. The button
    class owns boolean value and mechanical-action behavior; this asset owns
    the rectangular visual skin. placement_bounds declares the uniform 4 unit
    aura around the visible button_face. State, hover, pressed, disabled, text,
    and border colors are parameters, not separate SVG skins.
  </desc>

  <defs>
    <style>
      :root {
        --frog-button-label-display: none;
        --frog-button-label-fill: #6b7280;
        --frog-button-label-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-label-font-size: 12px;

        --frog-button-caption-display: inline;
        --frog-button-caption-fill: #111827;
        --frog-button-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-caption-font-size: 18px;
        --frog-button-caption-font-weight: 600;

        --frog-button-face-fill: #e2e8f0;
        --frog-button-face-stroke: #334155;
        --frog-button-face-stroke-width: 1px;

        --frog-button-state-text-display: inline;
        --frog-button-state-text-fill: #111111;
        --frog-button-state-text-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-state-text-font-size: 20px;
        --frog-button-state-text-font-weight: 400;

        --frog-button-transition: 120ms ease-out;
      }

      #label_text {
        display: var(--frog-button-label-display);
        fill: var(--frog-button-label-fill);
        font-family: var(--frog-button-label-font-family);
        font-size: var(--frog-button-label-font-size);
      }

      #caption_text {
        display: var(--frog-button-caption-display);
        fill: var(--frog-button-caption-fill);
        font-family: var(--frog-button-caption-font-family);
        font-size: var(--frog-button-caption-font-size);
        font-weight: var(--frog-button-caption-font-weight);
      }

      #placement_bounds {
        display: none;
        fill: none;
        stroke: none;
      }

      #button_face {
        fill: var(--frog-button-face-fill);
        stroke: var(--frog-button-face-stroke);
        stroke-width: var(--frog-button-face-stroke-width);
        vector-effect: non-scaling-stroke;
        transition: fill var(--frog-button-transition), stroke var(--frog-button-transition), transform var(--frog-button-transition);
      }

      #state_text {
        display: var(--frog-button-state-text-display);
        fill: var(--frog-button-state-text-fill);
        font-family: var(--frog-button-state-text-font-family);
        font-size: var(--frog-button-state-text-font-size);
        font-weight: var(--frog-button-state-text-font-weight);
      }
    </style>
  </defs>

  <g id="root" data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="18">button_1</text>

    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          x="170"
          y="46"
          text-anchor="middle">Button</text>

    <rect id="placement_bounds"
          data-frog-part="placement_bounds"
          data-frog-role="placement_bounds"
          data-frog-bind="layout.placement_bounds.* layout.grid.*"
          x="22"
          y="82"
          width="296"
          height="88"
          pointer-events="none" />

    <rect id="button_face"
          data-frog-part="button_face"
          data-frog-anchor="button_face.bounds"
          x="26"
          y="86"
          width="288"
          height="80"
          rx="0"
          data-frog-bind="value style.button_face.*" />

    <text id="state_text"
          data-frog-part="state_text"
          data-frog-member="state_text.false_text state_text.true_text"
          data-frog-anchor="state_text.center"
          data-frog-bind="value state_text.* state_text.style.*"
          x="170"
          y="126"
          text-anchor="middle"
          dominant-baseline="middle">BUTTON</text>
  </g>
</svg>
