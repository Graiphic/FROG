<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 340 220"
     role="img"
     aria-label="FROG default button template realization resource"
     data-frog-template="frog.realizations.default.button.rectangular"
     data-frog-target-class="frog.widgets.button"
     data-frog-state="template">
  <title>FROG Default Button template Resource</title>
  <defs>
    <style>
      :root {
        --frog-button-label-display: none;
        --frog-button-label-fill: #6b7280;
        --frog-button-label-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-label-font-size: 12px;
        --frog-button-caption-display: inline;
        --frog-button-caption-fill: #111827;
        --frog-button-caption-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-caption-font-size: 18px;
        --frog-button-caption-font-weight: 600;
        --frog-button-frame-fill: transparent;
        --frog-button-frame-stroke: transparent;
        --frog-button-frame-stroke-width: 0px;
        --frog-button-face-fill: #e2e8f0;
        --frog-button-face-stroke: #334155;
        --frog-button-face-stroke-width: 4px;
        --frog-button-state-face-fill: transparent;
        --frog-button-state-face-stroke: transparent;
        --frog-button-state-face-stroke-width: 0px;
        --frog-button-state-text-fill: #111111;
        --frog-button-state-text-font-family: system-ui, Segoe UI, Arial, sans-serif;
        --frog-button-state-text-font-size: 20px;
        --frog-button-state-text-font-weight: 700;
        --frog-button-focus-display: none;
        --frog-button-focus-stroke: #2f80ed;
        --frog-button-focus-stroke-width: 3px;
        --frog-button-transition: 120ms ease-out;
      }
      #label_text { display: var(--frog-button-label-display); fill: var(--frog-button-label-fill); font-family: var(--frog-button-label-font-family); font-size: var(--frog-button-label-font-size); }
      #caption_text { display: var(--frog-button-caption-display); fill: var(--frog-button-caption-fill); font-family: var(--frog-button-caption-font-family); font-size: var(--frog-button-caption-font-size); font-weight: var(--frog-button-caption-font-weight); }
      #frame { fill: var(--frog-button-frame-fill); stroke: var(--frog-button-frame-stroke); stroke-width: var(--frog-button-frame-stroke-width); vector-effect: non-scaling-stroke; }
      #face { fill: var(--frog-button-face-fill); stroke: var(--frog-button-face-stroke); stroke-width: var(--frog-button-face-stroke-width); vector-effect: non-scaling-stroke; transition: fill var(--frog-button-transition), stroke var(--frog-button-transition); }
      #state_face { fill: var(--frog-button-state-face-fill); stroke: var(--frog-button-state-face-stroke); stroke-width: var(--frog-button-state-face-stroke-width); vector-effect: non-scaling-stroke; transition: fill var(--frog-button-transition), stroke var(--frog-button-transition), transform var(--frog-button-transition); }
      #state_text { fill: var(--frog-button-state-text-fill); font-family: var(--frog-button-state-text-font-family); font-size: var(--frog-button-state-text-font-size); font-weight: var(--frog-button-state-text-font-weight); }
      #focus_ring { display: var(--frog-button-focus-display); fill: none; stroke: var(--frog-button-focus-stroke); stroke-width: var(--frog-button-focus-stroke-width); vector-effect: non-scaling-stroke; }
    </style>
  </defs>
  <g id="root" data-frog-part="root">
    <text id="label_text" data-frog-part="label" data-frog-member="label.text" data-frog-anchor="label.anchor" x="16" y="18">button_1</text>
    <text id="caption_text" data-frog-part="caption" data-frog-member="caption.text" data-frog-anchor="caption.anchor" x="16" y="46">Button</text>
    <rect id="focus_ring" data-frog-part="focus_ring" data-frog-anchor="focus_ring.bounds" x="4" y="64" width="332" height="124" rx="6" data-frog-bind="interaction.focused style.focus_ring.*" />
    <rect id="frame" data-frog-part="frame" data-frog-anchor="frame.bounds" x="12" y="72" width="316" height="108" rx="0" data-frog-bind="style.frame.*" />
    <rect id="face" data-frog-part="face" data-frog-anchor="face.bounds" x="12" y="72" width="316" height="108" rx="0" data-frog-bind="style.face.*" />
    <rect id="state_face" data-frog-part="state_face" data-frog-anchor="state_face.bounds" x="12" y="72" width="316" height="108" rx="0" data-frog-bind="style.state_face.*" />
    <text id="state_text" data-frog-part="state_text" data-frog-member="state_text.false_text state_text.true_text" data-frog-anchor="state_text.center" x="170" y="127" text-anchor="middle" dominant-baseline="middle">BUTTON</text>
  </g>
</svg>
