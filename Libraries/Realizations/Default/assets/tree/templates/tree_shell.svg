<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 370" data-frog-template="frog.realizations.default.tree.shell">
  <title>FROG Default Tree Geometry Shell</title>
  <desc>Default Tree shell publishing only stable anchors and geometry surfaces. Rows, text, selection, expansion, editing, and scrollbar thumbs are runtime host overlays driven by .frog instance data.</desc>
  <g data-frog-part="root">
    <text data-frog-part="label" data-frog-anchor="label.anchor" x="16" y="22"></text>
    <text data-frog-part="caption" data-frog-anchor="caption.anchor" x="16" y="46"></text>
    <g data-frog-part="node_region">
      <rect x="16" y="64" width="486" height="260" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="vertical_scrollbar">
      <rect x="506" y="64" width="18" height="260" fill="none" stroke="none"/>
    </g>
    <g data-frog-part="horizontal_scrollbar">
      <rect x="16" y="328" width="486" height="18" fill="none" stroke="none"/>
    </g>
  </g>
</svg>
