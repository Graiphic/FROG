<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 150"
     role="img"
     aria-label="FROG default ring rectangular realization template"
     data-frog-template="frog.realizations.default.ring.rectangular"
     data-frog-target-classes="frog.widgets.ring_control frog.widgets.ring_indicator"
     data-frog-variant="rectangular">
  <title>FROG Default Ring Rectangular Realization Template</title>
  <desc>Semantic SVG template for the default ring closed selector realization.</desc>
  <style>
    #label_text { display: var(--frog-ring-label-display, none); }
    #caption_text { display: var(--frog-ring-caption-display, inline); }
    #value_face { fill: var(--frog-ring-value-face-fill, #ffffff); stroke: var(--frog-ring-value-face-stroke, #64748b); stroke-width: var(--frog-ring-value-face-stroke-width, 1); vector-effect: non-scaling-stroke; }
    #focus_ring { display: var(--frog-ring-focus-display, none); fill: none; stroke: var(--frog-ring-focus-stroke, #2563eb); stroke-width: var(--frog-ring-focus-stroke-width, 2px); vector-effect: non-scaling-stroke; }
    #value_display { fill: var(--frog-ring-value-display-color, #111827); }
    #selector_face { display: var(--frog-ring-selector-display, inline); fill: var(--frog-ring-selector-fill, #f1f5f9); stroke: var(--frog-ring-selector-stroke, #64748b); stroke-width: var(--frog-ring-selector-stroke-width, 1); vector-effect: non-scaling-stroke; }
    #selector_arrow { display: var(--frog-ring-selector-display, inline); fill: var(--frog-ring-selector-symbol, #111827); stroke: none; }
    #spinner { display: var(--frog-ring-spinner-display, none); }
    #increment_up rect,
    #increment_down rect { fill: var(--frog-ring-spinner-fill, #edf2f7); stroke: var(--frog-ring-spinner-border, #94a3b8); stroke-width: 1; vector-effect: non-scaling-stroke; }
    #increment_up path,
    #increment_down path { fill: var(--frog-ring-spinner-symbol, #334e68); stroke: none; }
  </style>
  <g data-frog-part="root">
    <text id="label_text"
          data-frog-part="label"
          data-frog-member="label.text"
          data-frog-anchor="label.anchor"
          x="16"
          y="22"
          font-size="12"
          font-family="Inter, Arial, sans-serif"
          fill="#111827">ring_1</text>
    <text id="caption_text"
          data-frog-part="caption"
          data-frog-member="caption.text"
          data-frog-anchor="caption.anchor"
          data-frog-bind="caption.text caption.visible caption.anchor.* caption.align.horizontal caption.style.*"
          x="16"
          y="46"
          font-size="14"
          font-family="Inter, Arial, sans-serif"
          font-weight="600"
          fill="#111827">Ring</text>
    <rect id="value_face"
          data-frog-part="value_face"
          data-frog-anchor="value_face.bounds"
          data-frog-bind="style.value_face.* data_entry.* interaction.*"
          x="22"
          y="76"
          width="214"
          height="30"
          fill="#ffffff"
          stroke="#64748b"
          stroke-width="1"/>
    <rect id="focus_ring"
          data-frog-part="focus_ring"
          data-frog-role="keyboard_focus_boundary"
          data-frog-anchor="focus_ring.bounds"
          data-frog-bind="interaction.focused style.focus_ring.*"
          x="0"
          y="74"
          width="266"
          height="34"
          rx="2"/>
    <g id="spinner"
       data-frog-part="spinner"
       data-frog-bind="display.increment_decrement_visible">
      <g id="increment_up"
         data-frog-part="increment_up"
         data-frog-member="increment()"
         data-frog-states="normal pressed"
         data-frog-state-law="normal-pressed-color-only"
         data-frog-bind="style.increment_button.*">
        <rect x="2" y="76" width="16" height="14" rx="1"/>
        <path d="M7 84 L13 84 L10 81 Z"/>
      </g>
      <g id="increment_down"
         data-frog-part="increment_down"
         data-frog-member="decrement()"
         data-frog-states="normal pressed"
         data-frog-state-law="normal-pressed-color-only"
         data-frog-bind="style.increment_button.*">
        <rect x="2" y="92" width="16" height="14" rx="1"/>
        <path d="M7 98 L13 98 L10 101 Z"/>
      </g>
    </g>
    <text id="value_display"
          data-frog-part="value_display"
          data-frog-member="value.selected_label"
          data-frog-anchor="value_display.left_center"
          data-frog-bind="value.selected_id value.selected_value value.selected_label items[] style.value_display.*"
          x="34"
          y="96"
          font-size="15"
          font-family="Inter, Arial, sans-serif"
          fill="#111827">Standby</text>
    <rect id="selector_face"
          data-frog-part="selector_face"
          data-frog-anchor="selector_face.bounds"
          data-frog-layout-anchor-part="value_face"
          data-frog-layout-anchor-edge="right"
          data-frog-layout-gap-units="0"
          data-frog-bind="display.selector_visible interaction.opened style.selector_face.*"
          x="236"
          y="76"
          width="28"
          height="30"
          fill="#f1f5f9"
          stroke="#64748b"
          stroke-width="1"/>
    <path id="selector_arrow"
          data-frog-detail="selector_arrow"
          data-frog-owner-part="selector_face"
          d="M246 88 L254 88 L250 94 Z"
          fill="#111827"/>
  </g>
</svg>
