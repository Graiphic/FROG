<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" role="img" aria-labelledby="title desc">
<title id="title">Graiphic : du comportement éprouvé au composant partagé</title>
<desc id="desc">Les propositions sont ouvertes ; Graiphic décide des intégrations et des versions officielles.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#487263"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#f6faf8"/>
<text x="38" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#153c2e">Graiphic : du comportement éprouvé au composant partagé</text>
<text x="38" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Les propositions sont ouvertes ; Graiphic décide des intégrations et des versions officielles.</text>
<rect x="38" y="114" width="1004" height="92" rx="10" fill="white" stroke="#b7d6c8" stroke-width="2"/>
<circle cx="70" cy="146" r="16" fill="#1b8151"/>
<text x="70" y="152" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="white">1</text>
<text x="102" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#153c2e">Proposer et examiner</text>
<text x="102" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Équipe Graiphic ou contributeurs : besoin, contrat, périmètre et critères de réussite.</text>
<path d="M540 213 V235" stroke="#487263" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="240" width="1004" height="92" rx="10" fill="white" stroke="#b7d6c8" stroke-width="2"/>
<circle cx="70" cy="272" r="16" fill="#1b8151"/>
<text x="70" y="278" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="white">2</text>
<text x="102" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#153c2e">Éprouver le comportement dans Studio</text>
<text x="102" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Vrais programmes, résultats, interactions et régressions directement concernés.</text>
<path d="M540 339 V361" stroke="#487263" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="366" width="1004" height="92" rx="10" fill="white" stroke="#b7d6c8" stroke-width="2"/>
<circle cx="70" cy="398" r="16" fill="#1b8151"/>
<text x="70" y="404" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="white">3</text>
<text x="102" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#153c2e">Qualifier le composant commun autonome</text>
<text x="102" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Une implémentation ; bibliothèque et CLI ; contrats, tests, provenance et limites.</text>
<path d="M540 465 V487" stroke="#487263" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="492" width="1004" height="92" rx="10" fill="white" stroke="#b7d6c8" stroke-width="2"/>
<circle cx="70" cy="524" r="16" fill="#1b8151"/>
<text x="70" y="530" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="white">4</text>
<text x="102" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#153c2e">Publier une version identifiée</text>
<text x="102" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Revue explicite des mainteneurs ; sources et dépendances attribuées ; licences conservées.</text>
<path d="M540 591 V613" stroke="#487263" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="38" y="618" width="1004" height="92" rx="10" fill="white" stroke="#b7d6c8" stroke-width="2"/>
<circle cx="70" cy="650" r="16" fill="#1b8151"/>
<text x="70" y="656" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="white">5</text>
<text x="102" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#153c2e">Faire évoluer les consommateurs volontairement</text>
<text x="102" y="683" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#476154">Studio garde sa version épinglée ; une nouvelle version publique exige une intégration qualifiée.</text>
</svg>
