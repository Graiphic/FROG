name: FROG reference checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-workspace:
    name: Reference workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run reference workspace checks
        run: |
          python Implementations/Reference/check_reference_workspace.py --include-pytest

  llvm-native-proof:
    name: LLVM native proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Rust runtime dependencies
        run: cargo fetch --manifest-path Implementations/Reference/Runtime/rust/Cargo.toml

      - name: Check manifest-backed native kernel bridge
        run: |
          python Implementations/Reference/check_reference_workspace.py --include-native-kernel-bridge
