name: FROG reference checks

on:
  push:
    branches:
      - main
    paths:
      - 'Conformance/**'
      - 'Examples/**'
      - 'Expression/**'
      - 'IR/**'
      - 'Libraries/**'
      - 'Language/**'
      - 'Profiles/**'
      - 'IDE/**'
      - 'Implementations/Reference/**'
      - 'Versioning/**'
      - 'sdk/**'
      - 'assets/**'
      - 'Readme.md'
      - 'conftest.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'setup.cfg'
      - '.github/workflows/reference-pipeline.yml'
      - '.github/workflows/reference-workspace.yml'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
  pull_request:
    paths:
      - 'Conformance/**'
      - 'Examples/**'
      - 'Expression/**'
      - 'IR/**'
      - 'Libraries/**'
      - 'Language/**'
      - 'Profiles/**'
      - 'IDE/**'
      - 'Implementations/Reference/**'
      - 'Versioning/**'
      - 'sdk/**'
      - 'assets/**'
      - 'Readme.md'
      - 'conftest.py'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'setup.cfg'
      - '.github/workflows/reference-pipeline.yml'
      - '.github/workflows/reference-workspace.yml'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
  workflow_dispatch:
    inputs:
      run_global_validation:
        description: 'Authorize the unchanged complete validation gate.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: reference-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-contract:
    name: Public Runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up ownership validation Python
        id: ownership-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile public Runtime contract smoke test
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Isdk/cpp/include \
            sdk/cpp/tests/runtime_contract_smoke.cpp \
            -o runtime-contract-smoke

      - name: Run public Runtime contract smoke test
        run: ./runtime-contract-smoke

      - name: Compile SDK Array transport owner
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Isdk/cpp/include \
            sdk/cpp/tests/runtime_array_transport_smoke.cpp \
            -o runtime-array-transport-smoke

      - name: Run SDK Array transport owner
        run: ./runtime-array-transport-smoke

      - name: Enforce canonical contract ownership
        run: |
          cmake \
            -DSCAN_ROOT=${{ github.workspace }} \
            -DCANONICAL_CONTRACT_HEADER=${{ github.workspace }}/sdk/cpp/include/frog/sdk/runtime_contract.hpp \
            "-DFROG_OWNERSHIP_PYTHON_EXECUTABLE=${{ steps.ownership-python.outputs.python-path }}" \
            -P sdk/cpp/cmake/verify_runtime_contract_ownership.cmake

  reference-workspace:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_global_validation == true }}
    name: Reference workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Implementations/Reference/requirements-test.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install -r Implementations/Reference/requirements-test.txt

      - name: Run reference workspace checks
        run: |
          python Implementations/Reference/check_reference_workspace.py --include-pytest

  llvm-native-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_global_validation == true }}
    name: LLVM native proof
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Implementations/Reference/Runtime/rust/Cargo.lock', 'Implementations/Reference/Runtime/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prepare Rust runtime dependencies
        run: cargo fetch --locked --manifest-path Implementations/Reference/Runtime/rust/Cargo.toml

      - name: Check manifest-backed native kernel bridge
        run: |
          python Implementations/Reference/check_reference_workspace.py --include-native-kernel-bridge

  widget-layer-only:
    name: Widget layer only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run widget-layer validation
        run: python Implementations/Reference/check_reference_workspace.py --widget-layer-only
