name: FROG reference checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference-workspace:
    name: Reference workspace checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run reference workspace checks
        run: |
          python Implementations/Reference/check_reference_workspace.py --include-pytest

  llvm-native-proof:
    name: LLVM native proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check LLVM module emission and native build
        run: |
          python Implementations/Reference/LLVM/tools/emit_llvm_module.py --check --build
