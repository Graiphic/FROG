name: Reference Workspace

# The automatic checks (including widget-layer-only) are authoritative in
# reference-pipeline.yml. Keep these original contexts for explicit diagnostics.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-workspace:
    name: Reference workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run reference workspace checks
        run: python Implementations/Reference/check_reference_workspace.py

  reference-pytest:
    name: Reference pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Implementations/Reference/requirements-test.txt

      - name: Install reference test dependencies
        run: python -m pip install -r Implementations/Reference/requirements-test.txt

      - name: Run reference workspace pytest checks
        run: python Implementations/Reference/check_reference_workspace.py --include-pytest

  widget-layer-only:
    name: Widget layer only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run widget-layer validation
        run: python Implementations/Reference/check_reference_workspace.py --widget-layer-only

  reference-native-kernel-bridge:
    name: Reference native kernel bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Cache Cargo dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Implementations/Reference/Runtime/rust/Cargo.lock', 'Implementations/Reference/Runtime/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prepare Rust runtime dependencies
        run: cargo fetch --locked --manifest-path Implementations/Reference/Runtime/rust/Cargo.toml

      - name: Run native kernel bridge checks
        run: python Implementations/Reference/check_reference_workspace.py --include-native-kernel-bridge
